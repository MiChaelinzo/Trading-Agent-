[tool.poetry]
name = "trading_bot"
version = "0.1.0"
description = "Automated Stock Trading via Deep Q-Learning"
authors = []

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
tensorflow = ">=2.16.0"
pandas = ">=2.0.0"
numpy = ">=1.24.0,<2.0.0"
tqdm = ">=4.66.0"
docopt = ">=0.6.2"
coloredlogs = ">=15.0"
jupyterlab = ">=4.0.0"
altair = ">=5.0.0"
seaborn = ">=0.13.0"
scikit-learn = ">=1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
